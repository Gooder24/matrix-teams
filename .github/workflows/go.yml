name: Go

on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'asus' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Install tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Formatting
        run: test -z "$(goimports -l -local github.com/Gooder24/matrix-teams .)"
      - run: go vet ./...
      - run: staticcheck ./...
      - run: go build ./...
      - run: go test ./...
